# ServerStick NetworkManager defaults.
# Wired: every Ethernet port gets an automatic DHCP profile ("Wired connection N").
# DNS goes through systemd-resolved (detected from the /etc/resolv.conf symlink).

[main]
# Headless box: never stop retrying (default gives up after 4 attempts and waits 5 min).
autoconnect-retries-default=0

[keyfile]
# Tailscale manages its own interface.
unmanaged-devices=interface-name:tailscale*
